name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: custom-linux-ubuntu-latest-8-core
    name: Build and Push Docker Image to Scaleway Container Registry
    env:
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Determine Grafana version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_REGISTRY_API_KEY }}
          registry: ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          REGISTRY: ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}
          REPOSITORY: grafana-oss
          VERSION: ${{ steps.version.outputs.version }}
        with:
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}/grafana-oss:${{ steps.version.outputs.version }}
            ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}/grafana-oss:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
